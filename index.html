<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VOIDX Admin</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial;background:#10121a;color:#f4f5fa}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;box-sizing:border-box}.panel{width:min(100%,440px);background:#20232f;border:1px solid #373b4a;border-radius:18px;padding:24px;box-sizing:border-box}h1{margin:0;color:#45d5ac;font-size:28px}p{color:#aeb6c8}label{display:block;margin:16px 0 6px;font-size:14px}input,select,button{box-sizing:border-box;width:100%;border-radius:9px;padding:13px;font:inherit}input,select{background:#111520;color:white;border:1px solid #4c5367}button{background:#32cba0;border:0;color:#091d19;font-weight:700;margin-top:20px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#3c4355;color:white}.hidden{display:none}#message{min-height:22px;overflow-wrap:anywhere}#keyOutput{overflow-wrap:anywhere;font-weight:700;color:#64e5c0}small{color:#9ca7bb}
</style></head><body><main class="panel"><h1>VOIDX V5</h1><p>Private License Administration</p><section id="loginPanel"><form id="loginForm"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn">Log in</button></form></section><section id="adminPanel" class="hidden"><p id="signedIn"></p><form id="generateForm"><label for="duration">License duration</label><select id="duration"><option value="1">24 hours</option><option value="7">7 days</option><option value="30">30 days</option><option value="lifetime">Lifetime</option></select><label for="devices">Maximum devices</label><input id="devices" type="number" min="1" max="5" value="1" required><button id="generateBtn">Generate license</button></form><p id="keyOutput"></p><button id="copyBtn" class="secondary hidden">Copy generated key</button><button id="logoutBtn" class="secondary">Log out</button></section><p id="message" role="status" aria-live="polite"></p><small>Only authenticated, allowlisted admins can generate keys. Do not publish server secrets.</small></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
// Replace these two PUBLIC configuration values with your project's values.
const SUPABASE_URL = 'https://jbuocitdxrisqsgnjues.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_mn6WpIs6mRUIwNqfTZmhsQ_1bBKvKzv';
const FUNCTION_NAME = 'generate-voidx-key';
const $ = id => document.getElementById(id);
const message = (text, error=false) => { $('message').textContent=text; $('message').style.color=error?'#ff9d9d':'#70e3bc'; };
if(SUPABASE_URL.startsWith('YOUR_') || SUPABASE_PUBLISHABLE_KEY.startsWith('YOUR_')) {message('Configure your Supabase URL and publishable key in index.html first.',true);throw Error('Missing public Supabase configuration');}
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let lastKey='';
async function refresh(){const {data:{session}}=await supabase.auth.getSession();$('loginPanel').classList.toggle('hidden',!!session);$('adminPanel').classList.toggle('hidden',!session);$('signedIn').textContent=session?.user?.email||'';if(!session){lastKey='';$('keyOutput').textContent='';$('copyBtn').classList.add('hidden');}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;message('Signing in...');try{const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';message('Signed in.');await refresh();}catch(err){message(err.message,true)}finally{$('loginBtn').disabled=false}});
$('generateForm').addEventListener('submit',async e=>{e.preventDefault();$('generateBtn').disabled=true;message('Generating...');lastKey='';$('keyOutput').textContent='';$('copyBtn').classList.add('hidden');try{const {data:{session},error:sessionError}=await supabase.auth.getSession();if(sessionError||!session)throw Error('Please log in again');const duration=$('duration').value;const maxDevices=Number($('devices').value);if(!Number.isInteger(maxDevices)||maxDevices<1||maxDevices>5)throw Error('Choose 1–5 devices');const {data,error}=await supabase.functions.invoke(FUNCTION_NAME,{body:{duration_days:duration==='lifetime'?null:Number(duration),max_devices:maxDevices}});if(error){let detail=error.message;try{const payload=await error.context?.json();detail=payload?.error||detail}catch{}throw Error(detail)}if(!data?.success||typeof data.key!=='string')throw Error(data?.error||'No key returned');lastKey=data.key;$('keyOutput').textContent=lastKey;$('copyBtn').classList.remove('hidden');message('License generated. Copy it now; the server stores only its hash.')}catch(err){message(err.message,true)}finally{$('generateBtn').disabled=false}});
$('copyBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(lastKey);message('Key copied.')}catch{message('Copy the displayed key manually.',true)}});
$('logoutBtn').addEventListener('click',async()=>{const {error}=await supabase.auth.signOut();if(error){message(error.message,true);return}await refresh();message('Logged out.')});
supabase.auth.onAuthStateChange(()=>{setTimeout(refresh,0)});await refresh();
</script></body></html>
